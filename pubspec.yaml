name: toptopgo_driver
description: TopTopGo - Application Chauffeur
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Réseau & API ──
  http: ^1.2.0
  shared_preferences: ^2.2.2

  # ── Cartes & Géolocalisation ──
  google_maps_flutter: ^2.6.0
  geolocator: ^14.0.2

  # ── Images & Médias ──
  image_picker: ^1.0.7           # ✅ Upload photo de profil chauffeur
  cached_network_image: ^3.3.1

  # ── Liens externes (appel téléphonique, email) ──
  url_launcher: ^6.2.0           # ✅ AJOUTÉ — bouton appel dans chat + liens

  # ── Appels voix in-app (Agora RTC) ──────────────────────────────
  agora_rtc_engine: ^6.3.2       # ✅ AJOUTÉ — appels voix/vidéo (WhatsApp-like)
  permission_handler: ^11.3.1    # ✅ AJOUTÉ — permissions micro & caméra
  wakelock_plus: ^1.2.8          # ✅ AJOUTÉ — écran allumé pendant l'appel

  # ── Utilitaires ──
  intl: ^0.20.2
  flutter_spinkit: ^5.2.0
  intl_phone_field: ^3.2.0

  # ── Notifications temps réel & WebSocket ──
  pusher_channels_flutter: ^2.0.0

  # ── Notifications locales (son, badge) ──
  flutter_local_notifications: ^17.2.4

  # ── UI & Icônes ──
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1A1F2E"
  adaptive_icon_foreground: "assets/images/logo.png"
  background_color_ios: "#1A1F2E"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#1A1F2E"
    theme_color: "#29ABE2"

flutter:
  uses-material-design: true
  assets:
    - assets/images/